# sellee in a container — the secondary install profile; ./setup on the host is the primary
# one. Chrome is deliberately not in here: it runs on your own desktop, with your own logged-in
# marketplace sessions, and you start it.
#
#   docker compose build
#   ./start-chrome.sh                                # start-chrome.ps1 on Windows
#   docker compose up -d
#   docker exec -it sellee sellee setup
#
# On a Linux host, add the override: -f compose.yaml -f compose.linux.yaml
# Full reference: docs/docker.md

services:
  sellee:
    build: .
    image: sellee:local
    container_name: sellee
    restart: unless-stopped

    environment:
      # TZ plus one of the two credentials is required; the entrypoint refuses to start
      # otherwise. Not `${VAR:?}`, which compose evaluates on every command — including a
      # build that needs none of them.
      TZ: ${TZ:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    volumes:
      - ${SELLEE_DATA:-./sellee-data}:/data

    # The web tail, at http://127.0.0.1:7355/tail — `sellee logs --web` prints the URL with
    # its token. Host loopback only: this is the MCP and control surface too, and the daemon's
    # bearer tokens are all that guard it. Change this alongside `http_port` in config.json.
    ports:
      - "127.0.0.1:7355:7355"

    # `docker stop` is a SIGTERM the daemon drains on: lanes stop, the browser client closes, the
    # lock body is cleared. Give it room rather than being killed mid-drain.
    stop_grace_period: 30s
