[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sellee"
description = "Local single-tenant agent that sells/buys on P2P marketplaces from the user's own machine"
# uv pins the interpreter (see .python-version), so this floor describes the code, not a
# precondition a user's machine could fail to meet.
requires-python = ">=3.14"
dynamic = ["version"]
# Each runtime dependency is a supply-chain grant on a machine holding marketplace credentials
# and a logged-in browser, so adding one takes three edits: here, a relocked uv.lock, and
# ALLOWED_RUNTIME_DEPS in tests/guard/test_stdlib_only.py, which fails the suite otherwise.
# The major bound keeps a major bump a reviewed diff rather than a relock.
dependencies = [
    "psutil>=7,<8",
    # QR encoding for the Telegram bind deep link (terminal half-block + localhost SVG renders).
    # Pure Python, zero transitive deps, py3-none-any wheel.
    "segno>=1.6,<2",
    # Photo conversion: one converter on every platform, rather than an OS tool per platform.
    # pillow-heif is the HEIC decoder Pillow does not ship, and HEIC is what a phone produces.
    "pillow>=12,<13",
    "pillow-heif>=1.5,<2",
    # The Discord Gateway connection (a persistent WebSocket, unlike Telegram's long-poll). RFC
    # 6455 has enough edge cases (fragmentation, ping/pong, close-code negotiation) that a vetted
    # implementation is worth the grant; this is the maintainer-preferred pick over aiohttp, which
    # brings a full HTTP client/server stack this project doesn't need.
    "websockets>=17,<18",
]

# Dev tooling. A dependency *group* rather than an extra, because uv installs groups by default
# and drops them with --no-dev: one flag separates a dev tree from what a user's install gets.
[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # static type checker (never shipped): enforces the store's declared record/ack
    # shapes via `make typecheck`. Basic mode, so only annotated code is checked.
    "pyright",
    # the official MCP SDK drives our server in the conformance suite (never shipped).
    # Held below 2.0, which renamed the streamable-HTTP client entry point; moving the
    # conformance client to that API is its own change.
    "mcp>=1.29,<2",
    # parallel test execution for `make test`
    "pytest-xdist",
]

[tool.uv]
# Dependencies only — never sellee itself. An editable install would build this package on
# the user's machine mid-install and leave a .pth holding an absolute path into a version
# directory that update prunes. The launcher and pytest both put src/ on the path already.
package = false

[tool.setuptools.dynamic]
version = { attr = "sellee.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files that must ship with the package: the migration SQL, the marketplace/scam
# registries, the web tail's page, and the prompt layer. A versioned install is an unpacked
# source tree, so these are already in place there; the stanza is what keeps a wheel build honest.
[tool.setuptools.package-data]
sellee = [
    "migrations/*/*.sql",
    "data/*.json",
    "data/*.html",
    "data/*.txt",
    "skills/*.md",
    "skills/commands/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Deliberately behind requires-python: the tree is still written in 3.9-compatible syntax, and
# pinning ruff here keeps modernizing it one reviewable sweep rather than a drip of new syntax.
target-version = "py39"
line-length = 100
src = ["src", "tests"]
extend-include = ["bin/sellee"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade (respects target-version)
    "B",  # bugbear
    "TID", # tidy-imports: bans relative imports (see below)
]

[tool.ruff.lint.flake8-tidy-imports]
# Intra-package imports are absolute (from sellee.x import y) so moving a
# module never forces rewriting its own imports.
ban-relative-imports = "all"

[tool.pyright]
# Basic mode checks only what is annotated, so its blast radius is the annotated
# store surface — the JSON-boundary tool handlers (params: dict), the engines, and
# everything else stay unchecked and green. Scoped tight so the first run is not
# drowned by the rest of the still-untyped tree; widening is a separate decision.
include = ["src/sellee/store"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
