[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "selly-agent"
description = "Local single-tenant agent that sells/buys on P2P marketplaces from the user's own machine"
# The runtime is the interpreter uv pins (see .python-version), not whatever python3 a
# machine happens to have — so this floor is a statement about the code, not an install
# constraint a user could fail to meet.
requires-python = ">=3.14"
dynamic = ["version"]
# Runtime dependencies are a short, deliberate list. Each one is a supply-chain grant on a
# machine holding marketplace credentials and a logged-in browser, so adding one means:
# an entry here, a relocked uv.lock, and a matching entry in ALLOWED_RUNTIME_DEPS in
# tests/guard/test_stdlib_only.py — which fails the suite for any import not on that list.
# The major bound is deliberate: a major bump should be a reviewed diff, not a relock.
dependencies = [
    "psutil>=7,<8",
]

# Dev tooling. A dependency *group* rather than an optional-dependencies extra, because
# uv installs groups by default and excludes them with --no-dev: `uv sync` gives a working
# dev tree, and the installer's `uv sync --no-dev` gives a user exactly the runtime deps.
[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # static type checker (never shipped): enforces the store's declared record/ack
    # shapes via `make typecheck`. Basic mode, so only annotated code is checked.
    "pyright",
    # the official MCP SDK drives our server in the conformance suite (never shipped).
    # Held below 2.0, which renamed the streamable-HTTP client entry point; moving the
    # conformance client to that API is its own change.
    "mcp>=1.29,<2",
]

[tool.uv]
# Dependencies only — never install selly-agent itself into the venv. An editable install
# would run a build of this package on the user's machine mid-install and leave a .pth
# holding an absolute path into a version directory that update prunes. The launcher and
# pytest both put src/ on the path themselves, so nothing needs the install.
package = false

[tool.setuptools.dynamic]
version = { attr = "selly_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files that must ship with the package: the migration SQL, the marketplace/scam
# registries, the web tail's page, and the prompt layer. A versioned install is an unpacked
# source tree, so these are already in place there; the stanza is what keeps a wheel build honest.
[tool.setuptools.package-data]
selly_agent = [
    "migrations/*/*.sql",
    "data/*.json",
    "data/*.html",
    "skills/*.md",
    "skills/commands/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Deliberately behind requires-python. The runtime floor moved to 3.14, but the tree is
# still written in 3.9-compatible syntax and modernizing it is its own sweep; pinning ruff
# here keeps that sweep a single reviewable diff instead of drip-feeding new syntax in.
target-version = "py39"
line-length = 100
src = ["src", "tests"]
extend-include = ["bin/selly-agent"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade (respects target-version)
    "B",  # bugbear
    "TID", # tidy-imports: bans relative imports (see below)
]

[tool.ruff.lint.flake8-tidy-imports]
# Intra-package imports are absolute (from selly_agent.x import y) so moving a
# module never forces rewriting its own imports.
ban-relative-imports = "all"

[tool.pyright]
# Basic mode checks only what is annotated, so its blast radius is the annotated
# store surface — the JSON-boundary tool handlers (params: dict), the engines, and
# everything else stay unchecked and green. Scoped tight so the first run is not
# drowned by the rest of the still-untyped tree; widening is a separate decision.
include = ["src/selly_agent/store.py"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
