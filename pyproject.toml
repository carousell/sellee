[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "selly-agent"
description = "Local single-tenant agent that sells/buys on P2P marketplaces from the user's own machine"
requires-python = ">=3.9"
dynamic = ["version"]
# No runtime dependencies, ever: the user's own python3 is the runtime, and the
# test suite mechanically rejects any non-stdlib import under src/.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    # dev-only static type checker (never shipped): enforces the store's declared record/ack
    # shapes via `make typecheck`. Basic mode, so only annotated code is checked.
    "pyright",
    # dev-only: the official MCP SDK drives our server in the conformance suite (never shipped;
    # it needs 3.10+, so those tests skip on the 3.9 runtime floor).
    "mcp; python_version >= '3.10'",
]

[tool.setuptools.dynamic]
version = { attr = "selly_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files that must ship with the package: the migration SQL, the marketplace/scam
# registries, the web tail page, and the prompt layer. A versioned install is an unpacked source
# tree, so these are
# already in place there; the stanza is what keeps a wheel build honest.
[tool.setuptools.package-data]
selly_agent = [
    "migrations/*/*.sql",
    "data/*.json",
    "data/*.html",
    "skills/*.md",
    "skills/commands/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# py39 keeps ruff a mechanical enforcer of the 3.9 runtime floor: 3.10+ syntax
# (match, runtime X | Y unions) is flagged at lint time.
target-version = "py39"
line-length = 100
src = ["src", "tests"]
extend-include = ["bin/selly-agent"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade (respects target-version)
    "B",  # bugbear
    "TID", # tidy-imports: bans relative imports (see below)
]

[tool.ruff.lint.flake8-tidy-imports]
# Intra-package imports are absolute (from selly_agent.x import y) so moving a
# module never forces rewriting its own imports.
ban-relative-imports = "all"

[tool.pyright]
# Basic mode checks only what is annotated, so its blast radius is the annotated
# store surface — the JSON-boundary tool handlers (params: dict), the engines, and
# everything else stay unchecked and green. Scoped tight so the first run is not
# drowned by the rest of the still-untyped tree; widening is a separate decision.
include = ["src/selly_agent/store.py"]
typeCheckingMode = "basic"
pythonVersion = "3.9"
