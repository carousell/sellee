<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>selly-agent event tail</title>
<!--
  The human-readable face of the event log. The NDJSON stream (`logs --json`, and this page's
  own `?json=true` mode) stays the canonical machine form and the debugging tool; this view is for
  the casual "what is the agent doing?" question, so it hides and abbreviates aggressively. That
  is only safe because nothing is ever lost: every row expands to its raw wire JSON, and the
  verbose toggle reveals every row hidden by default.

  One tier never arrives at all: the server does not send `routine` events (the scheduler
  heartbeat) to this page. They are the bulk of the volume on a busy install and nobody opens a
  tail to read them, so they are dropped before the wire rather than hidden after it — which is
  also what lets a page open on a fixed count of events instead of a time window. `logs --all` in
  the terminal is where that tier is answered.

  Two rules hold throughout:
    * payload-derived strings reach the DOM only as textContent — a preview, a reply, or a tool
      result carries text a buyer wrote, and this page never gives it a chance to be markup;
    * an unrecognized kind falls back to a compact line rather than vanishing, so adding an event
      elsewhere in the codebase degrades gracefully here instead of going invisible.
-->
<style>
:root{
  --bg:#111; --panel:#191919; --rule:#2a2a2a; --fg:#ddd; --bright:#fff;
  --dim:#8a8a8a; --faint:#5a5a5a; --kind:#7cf; --ok:#7bc47f; --warn:#f0a35e; --warn-bg:#2e1f14;
  --user:hsl(174,48%,58%); --system:#7a7a7a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.75rem;
  padding:.45rem .75rem;background:var(--panel);border-bottom:1px solid var(--rule)}
header h1{margin:0;font-size:13px;font-weight:600}
header .spacer{flex:1}
header label,header button{font:inherit;color:var(--dim)}
header label{cursor:pointer;user-select:none}
#chip{display:none;align-items:center;gap:.4rem;padding:.05rem .45rem;cursor:pointer;
  background:transparent;border:1px solid var(--rule);border-radius:.75rem}
body.filtering #chip{display:inline-flex}
/* the raw-JSON mode renders no rows, so neither has anything to act on — but following still
   does, so its checkbox stays */
body.json #chip,body.json .verbose-toggle{display:none}

#log{padding:.3rem 0}
/* row-gap 0 so the raw-JSON line adds no height while it is closed; the right padding reserves
   the column its {} marker is pinned into. */
.row{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.5rem;row-gap:0;
  padding:.1rem 2.4rem .1rem .55rem;border-left:3px solid #303030}
.row:hover{background:#171717}
.row.warn{background:var(--warn-bg)}
/* Hidden by default: the per-kind noise set (the routine tier never reaches the page). `filtered`
   is pass isolation and outranks the verbose reveal, so isolating a pass never drags other
   passes back in. */
.row.noise,.row.filtered{display:none}
body.verbose .row.noise:not(.filtered){display:flex}

.t{flex:none;color:var(--faint)}
/* One fixed width for every pill, so each row's text starts at the same column whichever actor
   the pill names. */
.pill{flex:none;display:inline-block;width:14ch;padding:0 .4rem;overflow:hidden;
  text-align:center;text-overflow:ellipsis;white-space:nowrap;font:inherit;background:transparent;
  border:1px solid currentColor;border-radius:.7rem;cursor:pointer}
.pill.static{cursor:default}
.pill.user{color:var(--user)}
.pill.system{color:var(--system)}
.row.user{border-left-color:var(--user)}
.body{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}

.dim{color:var(--dim)}
.faint{color:var(--faint)}
.prominent{color:var(--bright)}
.kind{color:var(--kind)}
.ok{color:var(--ok)}
.bad{color:var(--warn)}
.arrow{color:var(--kind)}

details>summary{cursor:pointer}
details.tool>summary{list-style:none}
details.tool>summary::-webkit-details-marker{display:none}
.toolbody{margin:.15rem 0 .3rem 1.2rem;border-left:1px solid var(--rule);padding-left:.6rem}
.toolbody pre{margin:.15rem 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--dim)}
details.raw>summary{color:#3a3a3a;list-style:none}
details.raw>summary::-webkit-details-marker{display:none}
details.raw>pre{margin:.2rem 0 .4rem;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--dim)}
/* A row's own disclosure is always its own full-width flex line, and its {} marker is lifted out
   of flow into a fixed column at the right edge. Sizing the box only once it opens would re-flow
   the marker onto the next line — moving the very thing that was just clicked. Scoped to a row's
   direct child: the copies nested inside a folded tool body are plain blocks in a plain div. */
.row>details.raw{flex:1 0 100%}
.row>details.raw>summary{position:absolute;top:.1rem;right:.75rem}
.jsonline{padding:0 .75rem;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h1>selly-agent event tail</h1>
  <button id="chip" type="button" title="show every pass again">
    <span id="chip-label"></span><span aria-hidden="true">&#10005;</span>
  </button>
  <span class="spacer"></span>
  <label class="verbose-toggle"><input type="checkbox" id="verbose"> verbose</label>
  <label><input type="checkbox" id="follow" checked> follow</label>
</header>
<div id="log"></div>
<script>
"use strict";

const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const jsonMode = params.get("json") === "true";

// The page URL takes the CLI's --since grammar (30s / 15m / 2h / 1d). A casual reader starts
// near now, not at the beginning of the retention window.
const UNIT_SEC = {s: 1, m: 60, h: 3600, d: 86400};
function parseSince(raw, fallbackSec) {
  const match = /^(\d+)([smhd])$/.exec((raw || "").trim());
  return match ? Number(match[1]) * UNIT_SEC[match[2]] : fallbackSec;
}
// No default window: the page opens on the newest events whatever their age, the way `tail -n`
// does, so an agent idle since yesterday still opens on what it last did. ?since= narrows it.
const sinceSec = parseSince(params.get("since"), 0);
if (jsonMode) document.body.classList.add("json");

// --- components ------------------------------------------------------------------------------

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function span(text, cls) {
  return el("span", cls, text);
}

function parts(cls) {
  const node = el("span", cls);
  for (let i = 1; i < arguments.length; i++) {
    const bit = arguments[i];
    if (bit === null || bit === undefined) continue;
    node.appendChild(typeof bit === "string" ? document.createTextNode(bit) : bit);
  }
  return node;
}

function timeEl(event) {
  const node = el("span", "t", new Date(event.ts * 1000).toLocaleTimeString());
  node.title = event["@ts"] || "";
  return node;
}

// The uniform escape hatch: every row carries the wire JSON of its own event, so the view is
// free to abbreviate anything above it.
function rawDetails(event) {
  const details = el("details", "raw");
  details.appendChild(el("summary", null, "{}"));
  details.appendChild(el("pre", null, JSON.stringify(event, null, 2)));
  return details;
}

// A pass reads as a group when its events share a color — the single highest-leverage cue on a
// page where several passes interleave.
function hueFor(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) % 360;
  return hash;
}

function passColor(hue) {
  return "hsl(" + hue + ",55%,60%)";
}

function passPill(passId, hue) {
  const node = el("button", "pill", passId.replace(/^pass_/, ""));
  node.type = "button";
  node.style.color = passColor(hue);
  node.title = passId + " — click to isolate this pass";
  node.addEventListener("click", function () {
    setActivePass(activePass === passId ? null : passId);
  });
  return node;
}

// Every row gets a pill, so nothing sits offset from the pass rows. A row with no pass id still
// has an actor: the seller speaking, or the daemon acting on its own. Neither is a span you can
// click — only a pass is something to isolate.
function staticPill(label) {
  return el("span", "pill static " + label, label);
}

function oneLine(value, cap) {
  if (value === undefined || value === null) return "";
  const text = typeof value === "string" ? value : JSON.stringify(value);
  const limit = cap || 140;
  return text.length > limit ? text.slice(0, limit) + "…" : text;
}

function pretty(value) {
  if (typeof value === "string") return value;
  return JSON.stringify(value, null, 2);
}

// --- call/result pairing ---------------------------------------------------------------------

// A result folds into the row of the call it answers. Keyed by pass so interleaved passes never
// cross-pair, and dropped on match so the map stays bounded over a long tail. Two id families,
// never mixed: the harness `tool_use_id` (what the model saw) and the server's own `call_id` —
// the harness id never reaches the server, so folding across the two would be guesswork.
const FOLDED = "folded";
const pending = new Map();

function pairKey(passId, id) {
  return (passId || "-") + " " + id;
}

function toolDetails(cls) {
  const details = el("details", "tool" + (cls ? " " + cls : ""));
  const summary = el("summary");
  const body = el("div", "toolbody");
  details.appendChild(summary);
  details.appendChild(body);
  return {details: details, summary: summary, body: body};
}

function foldOrRow(ctx, id, mark, markCls, bodyText, standaloneSummary, standaloneCls) {
  const key = id ? pairKey(ctx.passId, id) : null;
  const slot = key ? pending.get(key) : undefined;
  if (slot) {
    pending.delete(key);
    slot.summary.appendChild(span(mark, markCls));
    slot.body.appendChild(el("pre", null, bodyText));
    slot.body.appendChild(rawDetails(ctx.event));
    if (markCls === "bad") {
      const row = slot.details.closest(".row");
      if (row) row.classList.add("warn");
    }
    return FOLDED;
  }
  // A call outside the lookback window (or before a reload) has no row to fold into. Standing
  // alone beats being dropped.
  const standalone = toolDetails(standaloneCls);
  for (const bit of standaloneSummary) {
    standalone.summary.appendChild(typeof bit === "string" ? document.createTextNode(bit) : bit);
  }
  standalone.summary.appendChild(span(mark, markCls));
  standalone.body.appendChild(el("pre", null, bodyText));
  return standalone.details;
}

// --- renderers -------------------------------------------------------------------------------

function fallbackRow(payload, ctx) {
  return parts(null, span(ctx.event.kind, "kind"), " ", span(oneLine(payload, 400), "dim"));
}

function settingRenderer(verb) {
  return function (payload) {
    const value = payload.rendered !== undefined ? payload.rendered : payload.value;
    return parts(
      null,
      span("setting " + (payload.key || "?") + " " + verb, "kind"),
      value === undefined ? null : " ",
      value === undefined ? null : span(oneLine(value), "dim")
    );
  };
}

function taskFailure(payload) {
  const node = parts(
    null,
    span("task " + (payload.task || "?") + " failed", "bad"),
    payload.error ? ": " + payload.error : null,
    payload.delay_sec === undefined ? null : span(" · retry in " + payload.delay_sec + "s", "dim")
  );
  node.dataset.warn = "1";
  return node;
}

const RENDERERS = {
  // the two voices in the conversation, and the agent's own narration between them
  "channel.in": function (payload) {
    return parts("prominent", span("← ", "arrow"), payload.preview || "");
  },
  "message.out": function (payload) {
    return parts("prominent", span("→ ", "arrow"), payload.text || "");
  },
  "pass.message": function (payload) {
    return span(payload.text || "", "prominent");
  },

  // harness view of a tool call: what the model asked for, paired with what it got back
  "pass.tool_use": function (payload, ctx) {
    const node = toolDetails();
    node.summary.appendChild(document.createTextNode("⚙ "));
    node.summary.appendChild(span(payload.name || "tool", "kind"));
    if (payload.id) pending.set(pairKey(ctx.passId, payload.id), node);
    return node.details;
  },
  "pass.tool_result": function (payload, ctx) {
    // ↩, not ✓: the harness stream says a result came back, never whether it succeeded. The
    // server's own tool.result/tool.error rows are where an outcome is actually known.
    return foldOrRow(
      ctx,
      payload.tool_use_id,
      " ↩",
      "dim",
      pretty(payload.content),
      ["⚙ ", span("result", "dim")],
      "dim"
    );
  },

  // server-side ground truth for the same calls, on its own id family
  "tool.call": function (payload, ctx) {
    const node = toolDetails();
    node.summary.appendChild(document.createTextNode("⚙ "));
    node.summary.appendChild(span(payload.tool || "tool", "kind"));
    node.summary.appendChild(span(" " + oneLine(payload.params), "dim"));
    if (payload.call_id) pending.set(pairKey(ctx.passId, payload.call_id), node);
    return node.details;
  },
  "tool.result": function (payload, ctx) {
    return foldOrRow(
      ctx,
      payload.call_id,
      " ✓",
      "ok",
      pretty(payload.result),
      ["⚙ ", span(payload.tool || "tool", "kind")],
      "dim"
    );
  },
  "tool.error": function (payload, ctx) {
    const node = foldOrRow(
      ctx,
      payload.call_id,
      " ✗",
      "bad",
      pretty(payload.error),
      ["⚙ ", span(payload.tool || "tool", "kind")],
      null
    );
    if (node !== FOLDED) node.dataset.warn = "1";
    return node;
  },

  // pass lifecycle
  "pass.start": function (payload) {
    return parts(null, span("pass start", "kind"), " ", span("(" + (payload.type || "?") + ")", "dim"));
  },
  "pass.end": function (payload) {
    const cls = payload.class || (payload.is_error ? "error" : "ok");
    const failed = Boolean(payload.is_error) || cls !== "ok";
    const node = parts(
      null,
      span("pass end", "kind"),
      " ",
      span(cls, failed ? "bad" : "ok"),
      payload.rc === undefined || payload.rc === null ? null : span(" · rc " + payload.rc, "dim"),
      payload.error ? span(" · " + payload.error, "bad") : null
    );
    if (failed) node.dataset.warn = "1";
    return node;
  },
  "pass.init": function (payload) {
    const tools = Array.isArray(payload.tools) ? payload.tools.length : 0;
    const session = (payload.session_id || "?").slice(0, 8);
    return span("session " + session + " · " + tools + " tools", "faint");
  },
  // pass.raw is a catch-all, not a thinking marker: only the thinking-token tick is noise, every
  // other unrecognized harness line stays visible.
  "pass.raw": function (payload) {
    let inner = null;
    try {
      inner = JSON.parse(payload.line);
    } catch (err) {
      inner = null;
    }
    if (inner && inner.type === "system" && inner.subtype === "thinking_tokens") {
      const tick = span("thinking", "faint");
      tick.dataset.noise = "1";
      return tick;
    }
    return span(oneLine(payload.line, 400), "faint");
  },

  "setting.proposed": settingRenderer("proposed"),
  "setting.changed": settingRenderer("changed"),
  "setting.cancelled": settingRenderer("cancelled"),
  "setting.expired": settingRenderer("expired"),

  "task.error": taskFailure,
  "task.backoff": taskFailure,

  // redundant for casual reading next to the rows they accompany; hidden unless verbose
  "pass.queued": function (payload) {
    return span("queued (" + (payload.type || "?") + ")", "faint");
  },
  "message.delivered": function () {
    return span("delivered", "faint");
  },
  "channel.handled": function (payload) {
    return span("handled by " + (payload.by || "?"), "faint");
  },
  "pass.result": function (payload) {
    return span("result " + (payload.subtype || "?") + " · " + (payload.num_turns || 0) + " turns", "faint");
  },
};

// Kinds the wire calls "info" but a casual reader does not need. The routine tier is not listed
// here because it never arrives — the server drops it for this page.
const NOISE_KINDS = new Set([
  "pass.queued",
  "message.delivered",
  "channel.handled",
  "pass.result",
]);

// Pass-less kinds that are the seller's own voice rather than the daemon's. Only inbound channel
// messages qualify today: everything else without a pass id is the daemon acting on its own.
const USER_KINDS = new Set(["channel.in"]);

// --- rows ------------------------------------------------------------------------------------

const log = document.getElementById("log");
const chip = document.getElementById("chip");
const chipLabel = document.getElementById("chip-label");
const verbose = document.getElementById("verbose");
const followBox = document.getElementById("follow");
let activePass = null;

function applyFilter(row) {
  row.classList.toggle("filtered", Boolean(activePass) && row.dataset.pass !== activePass);
}

function setActivePass(passId) {
  activePass = passId;
  document.body.classList.toggle("filtering", Boolean(passId));
  chipLabel.textContent = passId || "";
  for (const row of log.children) applyFilter(row);
  pinIfFollowing();  // hiding or revealing rows changes the height without firing a scroll
}

chip.addEventListener("click", function () {
  setActivePass(null);
});
verbose.addEventListener("change", function () {
  document.body.classList.toggle("verbose", verbose.checked);
  pinIfFollowing();
});

// --- following -------------------------------------------------------------------------------

// Following is a latched state, not a property of the current scroll position: appending rows
// grows the page under a reader who was at the bottom, and that fires no scroll event, so
// "am I at the bottom right now?" is the wrong question to ask per batch.
let following = followBox.checked;
let lastScrollY = window.scrollY;
// A few pixels of slack — fractional device pixel ratios mean the arithmetic rarely lands exact.
const BOTTOM_SLOP_PX = 4;

function atBottom() {
  const doc = document.documentElement;
  return doc.scrollHeight - (window.scrollY + window.innerHeight) <= BOTTOM_SLOP_PX;
}

function scrollToBottom() {
  window.scrollTo(0, document.documentElement.scrollHeight);
  lastScrollY = window.scrollY;
}

function setFollowing(on) {
  following = on;
  followBox.checked = on;
}

function pinIfFollowing() {
  if (following) scrollToBottom();
}

window.addEventListener(
  "scroll",
  function () {
    const y = window.scrollY;
    const wentUp = y < lastScrollY;
    lastScrollY = y;
    // Reaching the bottom re-arms following; deliberately scrolling away from it gives up. The
    // bottom check comes first because an overscroll bounce reports an upward delta while still
    // pinned there.
    if (atBottom()) setFollowing(true);
    else if (wentUp) setFollowing(false);
  },
  {passive: true}
);

followBox.addEventListener("change", function () {
  setFollowing(followBox.checked);
  pinIfFollowing();
});

function renderRow(event) {
  const passId = event.pass_id;
  const row = el("div", "row");
  row.dataset.pass = passId || "";
  row.appendChild(timeEl(event));
  if (passId) {
    const hue = hueFor(passId);
    row.style.borderLeftColor = passColor(hue);
    row.appendChild(passPill(passId, hue));
  } else if (USER_KINDS.has(event.kind)) {
    row.classList.add("user");
    row.appendChild(staticPill("user"));
  } else {
    row.appendChild(staticPill("system"));
  }

  const renderer = RENDERERS[event.kind] || fallbackRow;
  const payload = event.payload || {};
  let rendered;
  try {
    rendered = renderer(payload, {event: event, passId: passId});
  } catch (err) {
    rendered = fallbackRow(payload, {event: event});
  }
  if (rendered === FOLDED) return null;

  const body = el("span", "body");
  body.appendChild(rendered);
  row.appendChild(body);
  row.appendChild(rawDetails(event));

  const flags = rendered.dataset || {};
  // The level check is a guard, not the mechanism: the server already withholds the routine tier,
  // and this keeps the page honest if it is ever pointed at a source that does not.
  if (event.level === "routine" || NOISE_KINDS.has(event.kind) || flags.noise === "1") {
    row.classList.add("noise");
  }
  if (flags.warn === "1") row.classList.add("warn");
  applyFilter(row);
  return row;
}

function append(event) {
  if (jsonMode) {
    log.appendChild(el("div", "jsonline", JSON.stringify(event)));
    return;
  }
  const row = renderRow(event);
  if (row) log.appendChild(row);
}

// --- polling ---------------------------------------------------------------------------------

// null until the first response has been seen: sending no after_seq is what asks the server for
// the newest page rather than for everything from the beginning.
let after = null;

async function poll() {
  try {
    const query = new URLSearchParams({token: token});
    if (after === null) {
      if (sinceSec > 0) query.set("since_sec", String(sinceSec));
    } else {
      query.set("after_seq", String(after));
    }
    const response = await fetch("events.json?" + query);
    if (response.ok) {
      const data = await response.json();
      for (const event of data.events) append(event);
      after = data.last_seq;
      if (data.events.length) {
        pinIfFollowing();  // once per batch, not per row — one layout read instead of hundreds
      }
    }
  } catch (err) {
    // a poll that fails (daemon restarting, token rotated) just retries on the next tick
  }
  setTimeout(poll, 1000);
}

poll();
</script>
</body>
</html>
